name: HubSpot Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r 01_HubSpot_BC_O2C_Pipeline/requirements.txt

      - name: Run pipeline
        env:
          HS_TOKEN: ${{ secrets.HS_TOKEN }}
          HS_PIPELINE_ID: ${{ secrets.HS_PIPELINE_ID }}
        run: python 01_HubSpot_BC_O2C_Pipeline/hs_pipeline_V4.py
        # Production automation runs on a local, Windows-scheduled job that writes to the
        # author's OneDrive for the daily Power BI refresh — that local path isn't reachable
        # from this runner. This workflow pulls, cleans, and anonymizes real HubSpot data
        # end-to-end to demonstrate the pipeline logic and CI packaging; the final write step
        # is expected to no-op here rather than reach local storage (see hs_pipeline_V4.py Step 8).
