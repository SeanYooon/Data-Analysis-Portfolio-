name: HubSpot Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r 01_HubSpot_BC_O2C_Pipeline/requirements.txt

      - name: Run pipeline
        env:
          HS_TOKEN: ${{ secrets.HS_TOKEN }}
          HS_PIPELINE_ID: ${{ secrets.HS_PIPELINE_ID }}
        run: python 01_HubSpot_BC_O2C_Pipeline/hs_pipeline_V4.py

      - name: Commit output CSVs
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add *.csv
          git diff --staged --quiet || git commit -m "Auto-update data $(date +'%Y-%m-%d')"
          git push
