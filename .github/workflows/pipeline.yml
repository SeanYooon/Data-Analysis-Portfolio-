name: HubSpot Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r 01_HubSpot_BC_O2C_Pipeline/requirements.txt

      - name: Run pipeline
        env:
          HS_TOKEN: ${{ secrets.HS_TOKEN }}
          HS_PIPELINE_ID: ${{ secrets.HS_PIPELINE_ID }}
        run: python 01_HubSpot_BC_O2C_Pipeline/hs_pipeline_V4.py
        # CSV output is intentionally not committed to the repo.
        # In production, output would be written to a shared storage (e.g. OneDrive, SharePoint, or Azure Blob).
        # This pipeline demonstrates the automation structure; data privacy is maintained by excluding output files.
